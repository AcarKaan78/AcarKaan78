name: Generate Contribution Snake

# Renders the contribution-graph snake and pushes the SVGs to the `output` branch.
# The README pulls them from:  raw.githubusercontent.com/<user>/<user>/output/snake*.svg

on:
  schedule:
    # Every 12 hours (00:00 and 12:00 UTC)
    - cron: "0 */12 * * *"
  workflow_dispatch:        # lets you run it manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=c1121f&color_dots=#1a1a1a,#5e0b15,#8b0000,#c1121f,#f0a500
            dist/snake-dark.svg?palette=github-dark&color_snake=f0a500&color_dots=#0d0d0d,#5e0b15,#8b0000,#c1121f,#f0a500

      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
